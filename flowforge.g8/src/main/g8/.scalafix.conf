# FlowForge Scalafix Configuration
# Enforces functional programming best practices

rules = [
  ExplicitResultTypes,
  NoAutoTupling,
  NoValInForComprehension,
  ProcedureSyntax,
  RemoveUnused,
  DisableSyntax
]

# Disable problematic syntax for functional programming
DisableSyntax.noVars = true
DisableSyntax.noThrows = true  
DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noWhileLoops = true
DisableSyntax.noAsInstanceOf = false  # Sometimes needed for type casting
DisableSyntax.noIsInstanceOf = false  # Sometimes needed for pattern matching
DisableSyntax.noXml = true
DisableSyntax.noFinalVal = true
DisableSyntax.noFinalize = true

# Remove unused imports and variables
RemoveUnused.imports = true
RemoveUnused.privates = true
RemoveUnused.locals = true
RemoveUnused.patternvars = true