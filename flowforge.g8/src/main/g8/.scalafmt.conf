version = "3.7.17"

# FlowForge Standard Formatting Configuration
# Optimized for functional Scala and data pipeline readability

runner.dialect = scala213
maxColumn = 120

# Alignment and indentation
align.preset = more
align.multiline = false
continuationIndent.defnSite = 2
continuationIndent.extendSite = 4

# Import organization
importSelectors = singleLine
rewrite.imports.sort = scalastyle

# Function definitions
newlines.beforeCurlyLambdaParams = multilineWithCaseOnly
newlines.afterCurlyLambdaParams = squash

# Type annotations
spaces.inImportCurlyBraces = false
spaces.beforeContextBoundColon = Never

# Vertical alignment for better readability in pipeline DSLs  
verticalMultiline.atDefnSite = true
verticalMultiline.arityThreshold = 4
verticalMultiline.newlineAfterOpenParen = true

# Format string interpolation nicely
rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  ExpandImportSelectors,
  SortModifiers
]

# Optimize for FlowForge pipeline DSL readability
optIn.breakChainOnFirstMethodDot = true
includeCurlyBraceInSelectChains = true
includeNoParensInSelectChains = true

# Handle long function signatures (common in data pipelines)
binPack.parentConstructors = Never