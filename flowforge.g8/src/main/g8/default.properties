name=FlowForge Pipeline
description=A FlowForge data engineering pipeline with 100% compile-time contracts
organization=com.example
version=0.1.0-SNAPSHOT
scalaVersion=2.13.16
flowforgeVersion=0.1.0-SNAPSHOT

# Effect System Choice (cats-effect or zio)
effect_system=cats-effect

# Execution Engine Choice (spark, flink, or both)  
execution_engine=spark

# Include Quality Checks (true/false)
include_dq=true

# Include Lineage Tracking (true/false)
include_lineage=true

# Cloud Provider (gcp, aws, azure, local)
cloud_provider=gcp