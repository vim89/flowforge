name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Cache Ivy2
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/cache
          key: \${{ runner.os }}-ivy2-\${{ hashFiles('**/build.sbt') }}
          restore-keys: |
            \${{ runner.os }}-ivy2-

      - name: sbt format check
        run: sbt -v scalafmtSbtCheck scalafmtCheckAll

  # Needs the flowforge artifacts this project depends on to be resolvable from Maven Central. Until they
  # are, set the repository variable RUN_FULL to true to turn this on. The guard reads `vars` and not `env`,
  # because a job-level `if` cannot see `env`, which made the earlier version of this guard skip the job
  # even when RUN_FULL was set.
  build:
    runs-on: ubuntu-latest
    if: \${{ vars.RUN_FULL == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - name: Cache Ivy2
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/cache
          key: \${{ runner.os }}-ivy2-\${{ hashFiles('**/build.sbt') }}
          restore-keys: |
            \${{ runner.os }}-ivy2-
      - name: Compile
        run: sbt -v compile
      - name: Test
        run: sbt -v test
      - name: Package
        run: sbt -v package
