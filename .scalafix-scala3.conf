# The Scala 3 rule set, used by the `experimental` module.
#
# OrganizeImports.removeUnused, RemoveUnused and ProcedureSyntax are Scala 2 only: the first two need
# -Ywarn-unused, which Scala 3 does not report back to scalafix, and the third fixes a syntax Scala 3 does not
# have. Everything else, including the whole DisableSyntax gate, is inherited from the main config below so the
# two rule sets cannot drift apart.
include file(".scalafix.conf")

rules = [
  OrganizeImports,
  DisableSyntax,
  LeakingImplicitClassVal,
  NoValInForComprehension
]

OrganizeImports.removeUnused = false
