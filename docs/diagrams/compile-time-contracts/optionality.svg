<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340">
  <style>
    .title { font: bold 18px sans-serif; }
    .label { font: 14px sans-serif; }
    .box { fill: #f7fbff; stroke: #4a90e2; stroke-width: 1.2; }
    .arrow { stroke: #333; stroke-width: 1.2; marker-end: url(#arrowhead); fill: none; }
    .mono { font: 13px monospace; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="20" y="30" class="title">Field vs Element Optionality (Compile‑Time Contracts)</text>

  <!-- Field optionality column -->
  <rect class="box" x="20" y="60" width="380" height="240" rx="6"/>
  <text x="40" y="90" class="label">Case class field (field optionality)</text>
  <text x="40" y="115" class="mono">case class U(id: Long, note: Option[String])</text>

  <rect class="box" x="40" y="135" width="320" height="60" rx="6"/>
  <text x="55" y="160" class="label">FieldShape(name=&quot;note&quot;, shape=String, hasDefault=?, <tspan fill="#d14">isOptional=true</tspan>)</text>

  <line class="arrow" x1="200" y1="195" x2="200" y2="235"/>
  <rect class="box" x="40" y="235" width="320" height="45" rx="6"/>
  <text x="55" y="263" class="label">StructShape([... FieldShape ...])</text>

  <!-- Element optionality column -->
  <rect class="box" x="460" y="60" width="380" height="240" rx="6"/>
  <text x="480" y="90" class="label">Collection element (element optionality)</text>
  <text x="480" y="115" class="mono">type T = List[Option[String]]</text>

  <rect class="box" x="480" y="135" width="340" height="60" rx="6"/>
  <text x="495" y="160" class="label">SequenceShape(<tspan fill="#d14">OptionalShape</tspan>(String))</text>

  <line class="arrow" x1="650" y1="195" x2="650" y2="235"/>
  <rect class="box" x="480" y="235" width="340" height="45" rx="6"/>
  <text x="495" y="263" class="label">Represents List[Option[String]]</text>

  <!-- Footer note -->
  <text x="20" y="320" class="label">Under Exact/ExactUnordered, List[Option[A]] ≠ List[A]. Field optionality lives on FieldShape.isOptional; element optionality uses OptionalShape.</text>
</svg>

