name: Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    name: Scoverage + Codecov
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache SBT and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
            **/target
          key: ${{ runner.os }}-sbt-coverage-${{ hashFiles('**/build.sbt', '**/project/**/*.sbt', '**/project/**/*.scala') }}
          restore-keys: |
            ${{ runner.os }}-sbt-coverage-

      - name: Run coverage
        run: |
          sbt -batch clean coverage test coverageReport coverageAggregate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./target/scala-2.13/scoverage-report/scoverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

