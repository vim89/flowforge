name: Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '45 2 * * 1'  # Mondays 02:45 UTC

jobs:
  coverage:
    name: Scoverage + Codecov (unit modules)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (with SBT cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'sbt'

      - name: Run coverage (unit scope)
        run: |
          # Unit-coverage scope: generate reports without hard-failing on totals.
          # Gating now handled by Codecov patch/project statuses (see codecov.yml).
          sbt -batch -DwithSparkIT=false \
            clean coverage \
            "core/test" "infrastructure/test" "connectors/test" "contracts/test" \
            coverageReport coverageAggregate

      - name: Upload coverage to Codecov
        if: ${{ !env.ACT }}
        uses: codecov/codecov-action@v4
        with:
          files: |
            ./target/scala-2.13/scoverage-report/scoverage.xml
            ./modules/*/target/scala-2.13/scoverage-report/scoverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
