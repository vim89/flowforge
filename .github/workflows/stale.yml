name: Stale

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # PR settings
          stale-pr-message: |
            This PR has been automatically marked as stale because it has not had recent activity.
            It will be closed in 7 days if no further activity occurs.

            If you believe this PR is still relevant, please:
            - Add a comment explaining why
            - Rebase on the latest main branch
            - Request a review
          days-before-pr-stale: 60
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          exempt-pr-labels: 'keep-open,in-progress,blocked'

          # Issue settings
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.
            It will be closed in 14 days if no further activity occurs.

            If this issue is still relevant, please add a comment.
          days-before-issue-stale: 90
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          exempt-issue-labels: 'keep-open,bug,enhancement,good-first-issue'

          # Operation limits
          operations-per-run: 30
          remove-stale-when-updated: true
          ascending: true
