name: Claude (on-mention assistant)

on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]

concurrency:
  group: claude-on-mention-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude-assistant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action (FlowForge context)
        if: >-
          ((github.event_name == 'issue_comment' &&
            (contains(github.event.comment.body, '/ff-check') || contains(github.event.comment.body, 'CHECK CONTEXT') || contains(github.event.comment.body, '@claude')))
           ||
           (github.event_name == 'pull_request_review_comment' &&
            (contains(github.event.comment.body, '/ff-check') || contains(github.event.comment.body, 'CHECK CONTEXT') || contains(github.event.comment.body, '@claude'))))
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the FlowForge repository assistant. Follow AGENTS.md and ADRs precisely.
            If the comment contains "CHECK CONTEXT" or "/ff-check":
              - Run the Fast Loop from AGENTS.md (Session Workflow):
                1) Scan docs/adr (INDEX.md), docs/plan, docs/evidence, AGENTS.md, build.sbt
                2) Provide "SESSION GOAL: <concise objective>"
                3) Output a short actionable plan (bullets, 4–6 items)
                4) Call out risks, misalignments vs ADR‑022 and refactor-idiomatic-scala2.md
                5) Recommend next CI/test steps
            For general @claude mentions:
              - Answer concisely, include minimal diffs, and reference ADR‑022 for error handling
              - Prefer Safety/EffectSystem patterns; never suggest try/catch.
            Repository anchors:
              - ADR‑022 docs/adr/022-safe-generic-error-handling.md (Result/ValidatedResult, Safety, ErrorMapper)
              - ADR‑020 docs/adr/020-pipeline-30-point-checklist.md
              - Idioms docs/plan/refactor-idiomatic-scala2.md
              - AGENTS.md (agent workflow)
          claude_args: >-
            --allowedTools "Read" "Bash(git ls-files:*)" "Bash(rg:*)"
            --max-turns 6
            --verbose

      - name: Job summary (non-blocking)
        if: always()
        run: |
          echo "### Claude on-mention run" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by @claude mention." >> "$GITHUB_STEP_SUMMARY"
