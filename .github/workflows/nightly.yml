name: Nightly Extended Tests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_OPTS: -Xmx4G -XX:+UseG1GC
  SBT_OPTS: -Xmx4G -XX:+UseG1GC

jobs:
  nightly-full-suite:
    name: Full test suite (all modules)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        scala: ['2.13']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: 'sbt'
      - name: Coursier cache
        uses: coursier/cache-action@4e2615869d13561d626ed48655e1a39e5b192b3c

      - name: Check formatting
        run: |
          sbt -batch scalafmtCheckAll

      - name: Check scalafix
        continue-on-error: true
        run: |
          sbt -batch "scalafixAll --check"

      - name: Run full test suite
        run: |
          sbt -batch clean coverage test coverageReport coverageAggregate

      - name: Run compile-fail tests
        run: sbt -batch "compileFailTests/test"

      - name: Upload coverage to Codecov
        if: matrix.java == '17' && matrix.scala == '2.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  nightly-integration-tests:
    name: Integration tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
          cache: 'sbt'
      - name: Coursier cache
        uses: coursier/cache-action@4e2615869d13561d626ed48655e1a39e5b192b3c

      - name: Run Spark integration tests
        run: |
          sbt -batch -DwithSparkIT=true "enginesSpark/testOnly *SparkDeltaSCD2IT"

      - name: Run Flink integration tests
        run: |
          sbt -batch "enginesFlink/testOnly *EngineAbstractionSpec"

  nightly-cross-scala:
    name: Cross-Scala build (2.12, 2.13, 3.x)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12', '2.13', '3.3']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
          cache: 'sbt'
      - name: Coursier cache
        uses: coursier/cache-action@4e2615869d13561d626ed48655e1a39e5b192b3c

      - name: Build with Scala ${{ matrix.scala }}
        run: |
          # Cross-compile core modules
          sbt -batch "++${{ matrix.scala }}.* core/compile core/test"
          sbt -batch "++${{ matrix.scala }}.* infrastructure/compile infrastructure/test"

  nightly-benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
          cache: 'sbt'
      - name: Coursier cache
        uses: coursier/cache-action@4e2615869d13561d626ed48655e1a39e5b192b3c

      - name: Run benchmarks
        run: |
          if [ -d "modules/performance-benchmarks" ]; then
            sbt -batch "performance-benchmarks/Jmh/run -i 3 -wi 3 -f1 -t1"
          else
            echo "⚠️ No benchmark module found, skipping"
          fi

      - name: Upload benchmark results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: modules/performance-benchmarks/target/jmh-results*.json
          retention-days: 30

  nightly-template-validation:
    name: Validate g8 template
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
          cache: 'sbt'
      - name: Coursier cache
        uses: coursier/cache-action@4e2615869d13561d626ed48655e1a39e5b192b3c

      - name: Test g8 template generation
        run: |
          cd /tmp
          sbt new file://${{ github.workspace }}/flowforge.g8 --name="nightly-test" --organization="com.flowforge.nightly"
          cd nightly-test
          sbt compile test
