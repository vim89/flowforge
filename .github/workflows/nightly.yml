name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'

jobs:
  nightly-build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        spark: [ '3.5.0' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
            **/target
          key: ${{ runner.os }}-nightly-${{ hashFiles('**/build.sbt', '**/project/**/*.sbt', '**/project/**/*.scala') }}
          restore-keys: |
            ${{ runner.os }}-nightly-
      - name: Build
        run: |
          sbt -batch scalafmtCheckAll
          sbt -batch compile Test/compile
