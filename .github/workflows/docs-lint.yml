name: Docs Lint

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/docs-lint.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    name: Documentation Structure & Scaladoc
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run docs structure lint
        continue-on-error: true
        run: bash scripts/lint-docs.sh

      - name: Run Scaladoc coverage check
        run: |
          chmod +x scripts/doclint.sh
          ./scripts/doclint.sh | tee doclint-report.txt

      - name: Upload Scaladoc report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doclint-report
          path: doclint-report.txt
          retention-days: 7
