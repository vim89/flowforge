# Scalafix rules for test sources. Wired in build.sbt as `Test / scalafixConfig`.
#
# Test code is held to a different standard than main code on purpose. A test is the edge of the
# program, so it is the place where an effect is allowed to run; and a test for failure handling has
# to be able to build a failure. The rules dropped below are the ones that only make sense for code
# that sits inside the program rather than at its boundary:
#
#   noUnsafeRunSync - a test body is an edge. Running the effect there is the point.
#   noVars          - counters that record how many times a stub was called.
#   noThrows        - a test cannot check that a failure is handled without throwing one.
#   noNulls         - needed to test what happens when a Java API hands us null.
#   noIsInstanceOf  - asserting on the runtime type of a result.
#   noTryBlocks     - test setup and teardown that has to clean up whatever happened.
#   noScalaUtilTry  - same reason.
#
# Everything else still applies. noPrintln in particular: a test that prints is noise in CI output.

rules = [
  OrganizeImports,
  DisableSyntax,
  LeakingImplicitClassVal,
  NoAutoTupling,
  NoValInForComprehension,
  ProcedureSyntax,
  RemoveUnused
]

DisableSyntax.noReturns = true
DisableSyntax.noWhileLoops = true
DisableSyntax.noXml = true
DisableSyntax.regex = [
  {
    id = noPrintln
    pattern = "\\b(println|print)\\s*\\("
    message = "Use structured logging (Logger) instead of println/print in test code."
  },
  {
    id = noSystemOut
    pattern = "System\\.out\\.(println|print)"
    message = "Use structured logging (Logger) instead of System.out in test code."
  },
  {
    id = noConsolePrintln
    pattern = "Console\\.(println|print)"
    message = "Use structured logging (Logger) instead of Console.println in test code."
  },
  {
    id = noShadow_Cats_toValidatedNel
    pattern = "\\bdef\\s+toValidatedNel\\b"
    message = "Do not define toValidatedNel; use Cats EitherOps.toValidatedNel or name differently (ADR-025)."
  },
  {
    id = noShadow_Cats_toValidated
    pattern = "\\bdef\\s+toValidated\\b"
    message = "Do not define toValidated; use Cats EitherOps.toValidated or name differently (ADR-025)."
  }
]

OrganizeImports.removeUnused = true
OrganizeImports.groupedImports = Merge
