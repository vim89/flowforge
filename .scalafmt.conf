version = "3.8.5"
runner.dialect = scala213source3   # Scala 2.13 with -Xsource:3

# ---- Line length & wrapping ----
maxColumn = 110
danglingParentheses.preset = true
binPack.unsafeDefnSite = false
binPack.unsafeCallSite = false

# Keep Spark/Cats/ZIO chains readable
optIn.breaksInsideChains = true
newlines.beforeCurlyLambdaParams = multilineWithCaseOnly

# ---- Indentation & alignment ----
continuationIndent.callSite = 2
continuationIndent.defnSite = 2
align.preset = more
align.openParenCallSite = false
align.openParenDefnSite = false

# ---- Imports ----
# Scalafmt will sort selectors; for full grouping use Scalafix OrganizeImports.
# NOTE: Selector ordering (Ascii/SymbolsFirst/Keep) is a Scalafix OrganizeImports option, not Scalafmt.
rewrite.rules = [ SortImports, RedundantBraces, RedundantParens, PreferCurlyFors ]

# ---- Spacing & braces ----
includeCurlyBraceInSelectChains = false
assumeStandardLibraryStripMargin = true
docstrings.style = Asterisk
optIn.annotationNewlines = true

# ---- Trailing commas (clean diffs) ----
trailingCommas = always

# ---- Vertical layout ----
verticalMultiline.newlineAfterOpenParen = true
verticalMultiline.atDefnSite = true
verticalMultiline.arityThreshold = 3

# ---- EOL handling ----
lineEndings = preserve

# ---- Project scope ----
project.git = true
project.excludeFilters = [
  ".*target/.*",
  ".*/generated/.*",
  ".idea/",
  ".sbt*/",
  ".sbt/"
]

# ---- Spaces ----
spaces {
  inImportCurlyBraces = true
}

# ---- Sort modifier order (if you keep SortModifiers in rewrite.rules) ----
rewrite.sortModifiers.order = [
  "implicit", "final", "sealed", "abstract",
  "override", "private", "protected", "lazy"
]

# ---- Optional: keep hand-crafted newlines more often ----
# newlines.source = keep

# ---- Optional: mixed builds with Scala 3 sources ----
# fileOverride {
#   "glob:**/scala-3*/**" { runner.dialect = scala3 }
# }
