version: "3.7"

# FlowForge Lineage Stack - Marquez + PostgreSQL + Web UI
# 
# Usage:
#   docker compose -f ops/marquez/docker-compose.yml up -d
#   Open http://localhost:3000 for Marquez Web UI
#   FlowForge pipelines automatically emit lineage to http://localhost:5000
#
# Configuration:
#   Set OPENLINEAGE_URL=http://localhost:5000 (default in FlowForge)
#   Set OPENLINEAGE_NAMESPACE=your-namespace (defaults to 'flowforge')

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=marquez
      - POSTGRES_PASSWORD=marquez
      - POSTGRES_DB=marquez
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 10s
      timeout: 5s
      retries: 5

  marquez:
    image: marquezproject/marquez:latest
    ports:
      - "5000:5000"  # OpenLineage API endpoint
      - "5001:5001"  # Admin endpoint
    environment:
      - MARQUEZ_PORT=5000
      - MARQUEZ_ADMIN_PORT=5001
      - MARQUEZ_DB_HOST=postgres
      - MARQUEZ_DB_PORT=5432
      - MARQUEZ_DB_USER=marquez
      - MARQUEZ_DB_PASSWORD=marquez
      - MARQUEZ_DB_NAME=marquez
    depends_on:
      postgres:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:latest
    environment:
      - MARQUEZ_HOST=marquez
      - MARQUEZ_PORT=5000
    ports:
      - "3000:3000"  # Marquez Web UI
    depends_on:
      - marquez

volumes:
  postgres-data:
