# Scalafix rules for runnable demos and CLI entry points. Wired in build.sbt as `Compile /
# scalafixConfig` for the examples module and the three CLI modules.
#
# Only the rules about program output and about running an effect are dropped. Printing to stdout is
# what a CLI is for, and a demo's `main` is an edge of the program, which is where an effect is
# supposed to run. Every other rule still applies, because demo code is the code users copy.

rules = [
  OrganizeImports,
  DisableSyntax,
  LeakingImplicitClassVal,
  NoAutoTupling,
  NoValInForComprehension,
  ProcedureSyntax,
  RemoveUnused
]

DisableSyntax.noVars = true
DisableSyntax.noThrows = true
DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noWhileLoops = true
DisableSyntax.noIsInstanceOf = true
DisableSyntax.noXml = true
DisableSyntax.regex = [
  {
    id = noTryBlocks
    pattern = "\\btry\\s*\\{"
    message = "Use Safety.safely / EffectSystem.bracket/handleError instead of try/catch."
  },
  {
    id = noScalaUtilTry
    pattern = "\\bscala\\.util\\.Try\\b"
    message = "Use Safety.safely / EffectSystem.attempt instead of scala.util.Try."
  },
  {
    id = noShadow_Cats_toValidatedNel
    pattern = "\\bdef\\s+toValidatedNel\\b"
    message = "Do not define toValidatedNel; use Cats EitherOps.toValidatedNel or name differently (ADR-025)."
  },
  {
    id = noShadow_Cats_toValidated
    pattern = "\\bdef\\s+toValidated\\b"
    message = "Do not define toValidated; use Cats EitherOps.toValidated or name differently (ADR-025)."
  }
]

OrganizeImports.removeUnused = true
OrganizeImports.groupedImports = Merge
